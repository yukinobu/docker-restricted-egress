[Unit]
Wants=docker-restricted-egress.service

[Service]
# mangle/FORWARD exists independently of Docker's filter chains.
ExecStartPre=/usr/libexec/docker-restricted-egress/firewall guard
# docker-ce stops dockerd using systemd's signal handling after ExecStop.
# This also protects stop when the policy service previously failed to start.
ExecStop=/usr/libexec/docker-restricted-egress/firewall guard
# Cover failed starts and unexpected daemon exits as well.
ExecStopPost=/usr/libexec/docker-restricted-egress/firewall guard
